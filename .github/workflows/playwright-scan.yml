name: Playwright 補漏掃描

on:
  schedule:
    # 每日香港時間 10:00(UTC 02:00),排喺 Apps Script 主掃描之後
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: playwright-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rescue scan
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 直接寫入 Google Sheet(免 email):Apps Script 網頁應用程式 URL + token
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: node scan.mjs

      - name: Commit updated state
        run: |
          git config user.name "autotender-bot"
          git config user.email "autotender-bot@users.noreply.github.com"
          git add playwright-scanner/state/seen_items.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update playwright scanner seen items [skip ci]"
            git push
          fi
        working-directory: .
